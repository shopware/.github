# Lets the weekly release digest in shopware/service-enablement read the releases
# of the platform repositories it summarises (main runs and PR dry runs).
# https://github.com/shopware/service-enablement/pull/368

issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:shopware/service-enablement:(ref:refs/heads/main|pull_request)
claim_pattern:
  workflow_ref: shopware/service-enablement/.github/workflows/release-digest.yml@.*

permissions:
  contents: read

repositories:
  - service-registry
  - service-registry-dashboard
  - service-registry-client
  - aws-deploy-toolkit
  - terraform-app-hosting-ecs-module
  - services-aws-cloudfront-s3-module
