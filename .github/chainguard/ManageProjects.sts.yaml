# Allows shopware/shopware(-private) to manage projects

issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:shopware/shopware(-private)?:.*
claim_pattern:
  workflow_ref: shopware/shopware(-private)?/\.github/workflows/.*

permissions:
  pull_requests: read
  issues: read
  organization_projects: write
  repository_projects: write

repositories:
  - shopware
  - shopware-private
