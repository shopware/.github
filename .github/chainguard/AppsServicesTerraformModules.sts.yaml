# Allows repositories in shopware organization read access to apps & services terraform modules

issuer: https://token.actions.githubusercontent.com
# Repositories created after 2026-07-15 carry immutable OIDC subjects with the
# numeric org and repo IDs: repo:shopware@612628/<repo>@<repo-id>:<context>.
# The ID group stays optional so pre-cutoff repositories keep matching.
subject_pattern: repo:shopware(@612628)?/.*
claim_pattern:
  workflow_ref: shopware/.*/.github/workflows/.*

permissions:
  contents: read

repositories:
  - terraform-app-hosting-infra-modules
  - terraform-app-hosting-ecs-module
  - terraform-app-hosting-static-web-module
  - terraform-streaming-msk-module
  - services-aws-tags-module
  - services-aws-cloudfront-s3-module
  - terraform-data-dynamodb-cdc-module
  - terraform-data-sql-cdc-module
  - data-platform
