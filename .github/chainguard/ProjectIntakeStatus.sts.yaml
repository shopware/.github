# Lets gh-project-automation move new items on org project boards back to their
# intake status after GitHub's issue status sync. Scheduled and manual runs on main only.
# https://github.com/shopware/gh-project-automation/issues/119

issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:shopware(@612628)?/gh-project-automation(@948423217)?:ref:refs/heads/main
claim_pattern:
  workflow_ref: shopware/gh-project-automation/.github/workflows/project-intake-status.yml@refs/heads/main

permissions:
  organization_projects: write

repositories:
  - gh-project-automation
