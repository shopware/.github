# Allows the SaaS ATS to check out the acceptance test suites of services (read-only)

issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:shopware/saas:.*
claim_pattern:
  job_workflow_ref: shopware/saas/\.github/workflows/ats\.yml@.*

permissions:
  contents: read

repositories:
  - merchant-assistant-service
  - swagrecommendations
